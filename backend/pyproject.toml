[project]
name = "llm-style"
version = "0.1.0"
description = "Mood-based outfit recommender: local wardrobe + weather + small LLM stylist"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: hits a real Ollama server (opt-in)",
]
asyncio_mode = "auto"
